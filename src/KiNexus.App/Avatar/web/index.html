<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <!-- KI-Nexus (E3.1): nur eigene Dateien, Modelle aus https://modelle.kinexus, kein Internet. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://modelle.kinexus; connect-src 'self' blob: data: https://modelle.kinexus; media-src 'self' blob: mediastream:; worker-src 'self' blob:; font-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar-Testpanel – KI-Nexus</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div id="app">
    <main id="stage-wrap">
      <div id="stage"></div>
      <div id="status" aria-live="polite"></div>
      <div id="drop-hint">
        <p class="drop-title">Avatar laden</p>
        <p>Zieh eine <strong>.vrm</strong>-Datei hierher<br>oder wähle sie im Panel.</p>
      </div>
      <div id="drop-overlay"><p>Loslassen zum Laden</p></div>
      <div id="speech-bubble"></div>
      <button type="button" id="show-panel" title="Panel einblenden (H)" onclick="document.body.classList.remove('panel-hidden')">Panel</button>
    </main>
    <aside id="panel"></aside>
  </div>
  <script src="js/avatar-bundle.js"></script>
</body>
</html>
